name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only; every push to main deserves a
  # completed CI record (branch protection may require it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      # Packages to build and smoke-test. Keep in sync with the flake's
      # package set (nix/packages/default.nix). `nix flake check` still
      # evaluates every package output on both lanes, so evaluation
      # regressions are caught even if this list lags.
      PACKAGES: >-
        compact-toolchain
        compact-midnight
        midnight-circuit-params
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v4

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-packages-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-packages-
          gc-max-store-size-linux: 7500M
          gc-max-store-size-macos: 7500M

      # The formatter (nixfmt-tree) is platform-independent; gating it once on
      # the Linux lane is sufficient.
      - name: Check Nix formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          nix fmt
          git diff --exit-code

      - name: Build every flake package
        shell: bash
        run: |
          set -euo pipefail

          # Fail loudly if PACKAGES drifts from the flake's package set: a
          # package present in the flake but missing from the list would
          # otherwise ship with zero build and zero runtime coverage.
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          declared="$(nix eval --raw ".#packages.$system" \
            --apply 'p: builtins.concatStringsSep "\n" (builtins.attrNames p)' | sort)"
          listed="$(printf '%s\n' $PACKAGES | sort)"
          if [ "$declared" != "$listed" ]; then
            echo "::error::PACKAGES is out of sync with packages.$system:" >&2
            diff <(printf '%s\n' "$declared") <(printf '%s\n' "$listed") >&2 || true
            exit 1
          fi

          for pkg in $PACKAGES; do
            # midnight-circuit-params is a linkFarm of fixed-output fetches:
            # byte-identical across systems, so the Linux lane proves it.
            if [ "$RUNNER_OS" = macOS ] && [ "$pkg" = midnight-circuit-params ]; then
              echo "Skipping $pkg on macOS (platform-independent output, built on the Linux lane)"
              continue
            fi
            echo "Building $pkg"
            # Assign to a local var first so a failed `nix build` trips `set -e`;
            # piping straight into $GITHUB_ENV would mask the failure as success.
            out="$(nix build --no-link --print-out-paths .#"$pkg")"
            name="$(echo "${pkg//-/_}_OUT" | tr '[:lower:]' '[:upper:]')"
            echo "$name=$out" >> "$GITHUB_ENV"
          done

      - name: Smoke-test packaged binaries
        shell: bash
        run: |
          set -euo pipefail
          # The expected version comes from the package definition, not a
          # hardcoded literal, so a version bump updates this assert for free.
          ver="$("$COMPACT_TOOLCHAIN_OUT/bin/compactc" --version)"
          echo "compactc --version: $ver"
          expected="$(nix eval --raw .#compact-toolchain.version)"
          [ -n "$expected" ] || { echo "::error::empty version attr on .#compact-toolchain" >&2; exit 1; }
          # Literal whole-word match: rejects 0.31.10, 0.31.1-rc2, and any
          # regex-wildcard interpretation of `.` alike.
          if [[ " $ver " != *" $expected "* ]]; then
            echo "::error::compactc reports '$ver' but package version is '$expected'" >&2
            exit 1
          fi

          "$COMPACT_TOOLCHAIN_OUT/bin/fixup-compact" --help > /dev/null
          "$COMPACT_TOOLCHAIN_OUT/bin/format-compact" --help > /dev/null

          ver="$("$COMPACT_MIDNIGHT_OUT/bin/compact" --version)"
          echo "compact --version: $ver"
          expected="$(nix eval --raw .#compact-midnight.version)"
          [ -n "$expected" ] || { echo "::error::empty version attr on .#compact-midnight" >&2; exit 1; }
          if [[ " $ver " != *" $expected "* ]]; then
            echo "::error::compact reports '$ver' but package version is '$expected'" >&2
            exit 1
          fi

      - name: Assert circuit-parameter completeness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          expected=19
          for i in $(seq 1 "$expected"); do
            if [ ! -e "$MIDNIGHT_CIRCUIT_PARAMS_OUT/bls_midnight_2p$i" ]; then
              echo "::error::missing linkFarm entry bls_midnight_2p$i" >&2
              exit 1
            fi
          done
          actual="$(find "$MIDNIGHT_CIRCUIT_PARAMS_OUT" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          echo "linkFarm entries: $actual (expected exactly $expected)"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::linkFarm has $actual entries, expected $expected" >&2
            exit 1
          fi

      # Compiling a witness-bearing circuit exercises zkir generation and
      # prover/verifier key creation — twice: once with the packaged compactc
      # directly, and once through the devtool, whose compactc discovery relies
      # on the bin/compactc symlink target string (dontRewriteSymlinks + the
      # wrapper thisdir patch) that no other step exercises. On Linux the param
      # cache is pre-seeded from the hash-pinned linkFarm; the macOS lane
      # fetches the small circuit params it needs over the network.
      - name: End-to-end compile of test circuit
        shell: bash
        run: |
          set -euo pipefail
          # Snapshot name+type (not just count) so an in-place replacement or
          # rewrite by compactc is also caught, not only an added entry.
          cache_snapshot() {
            find "$HOME/.cache/midnight/zk-params" -mindepth 1 -maxdepth 1 -printf '%f %y\n' | sort
          }
          if [ "$RUNNER_OS" = Linux ]; then
            # Pre-seed the param cache from the already-built linkFarm so the
            # compile fetches nothing from Midnight's S3 (removes the external
            # fetch and the trust gap on this lane). -R (not -L) copies the
            # store symlinks instead of dereferencing ~200 MB of params; the
            # /nix/store paths outlive the job.
            mkdir -p "$HOME/.cache/midnight/zk-params"
            cp -Rn "$MIDNIGHT_CIRCUIT_PARAMS_OUT"/* "$HOME/.cache/midnight/zk-params/"
            seeded="$(cache_snapshot)"
          fi
          out="$(mktemp -d)"
          "$COMPACT_TOOLCHAIN_OUT/bin/compactc" test/lock.compact "$out"
          dtout="$(mktemp -d)"
          COMPACT_DIRECTORY="$COMPACT_TOOLCHAIN_OUT" \
            "$COMPACT_MIDNIGHT_OUT/bin/compact" compile test/lock.compact "$dtout"
          if [ "$RUNNER_OS" = Linux ]; then
            # Make the "fetches nothing" claim loud: any change to the cache
            # contents (added entries or rewrites) means a network fetch.
            if [ "$(cache_snapshot)" != "$seeded" ]; then
              echo "::error::pre-seed incomplete: zk-params cache changed during the compiles (network fetch or entry rewrite)" >&2
              exit 1
            fi
          fi

          # -s also rejects a truncated zero-byte artifact, not just a missing one.
          for dir in "$out" "$dtout"; do
            if [ ! -s "$dir/contract/index.js" ]; then
              echo "::error::missing contract/index.js in $dir" >&2
              exit 1
            fi
            for c in get set clear; do
              for f in "zkir/$c.zkir" "zkir/$c.bzkir" "keys/$c.prover" "keys/$c.verifier"; do
                if [ ! -s "$dir/$f" ]; then
                  echo "::error::missing $f in $dir" >&2
                  exit 1
                fi
              done
            done
          done
          echo "e2e artifacts OK (compactc + devtool): contract/, zkir/{get,set,clear}.zkir, keys/{get,set,clear}.{prover,verifier}"

      - name: Flake check
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            # Evaluates the aarch64-darwin outputs from Linux (no builds).
            nix flake check --all-systems
          else
            nix flake check
          fi
